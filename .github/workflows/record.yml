name: record-books

# Primary trigger: workflow_dispatch, called every ~15 min by cron-job.org.
# Backup trigger: GitHub's own schedule (fires late, and only from the default branch).
# Push trigger: smoke-tests the recorder against the live public API when its code changes.
#
# Storage: raw books are ENCRYPTED to the operator's public key (keys/recorder_public.pem)
# before upload, because artifacts on a public repo are downloadable by any signed-in
# GitHub user and Polymarket US restricts redistribution of its data. Only plain run
# stats (counts, timings) are readable. Until a real public key is committed, runs only
# measure and nothing is uploaded. To pause recording, disable this workflow in the
# repository's Actions tab.
on:
  workflow_dispatch:
    inputs:
      max_books:
        description: "Max order books to fetch this run"
        default: "800"
  schedule:
    - cron: "41 * * * *" # hourly backup; cron-job.org provides the 15-minute cadence
  push:
    branches: ["claude/**"]
    paths: ["recorder/**", "keys/**", ".github/workflows/record.yml"]

permissions:
  contents: read

concurrency:
  group: record-books
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Offline tests
        run: python -m unittest discover -s tests -t .
      - name: Record snapshot (public endpoints only, no keys)
        run: python -m recorder.record --out out --max-books "${{ github.event.inputs.max_books || '800' }}"
      - name: Job summary
        if: always()
        run: |
          echo '### Run metadata' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          python -c "import json,glob;m=json.load(open(glob.glob('out/run-*.json')[0]));m['n_errors']=len(m.pop('errors'));print(json.dumps(m,indent=2))" >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - name: Encryption key present?
        id: key
        run: |
          if grep -q "BEGIN PUBLIC KEY" keys/recorder_public.pem && ! grep -q "PRIVATE KEY" keys/recorder_public.pem; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "No real public key in keys/recorder_public.pem: measured only, nothing stored." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Encrypt books (raw data never leaves the runner unencrypted)
        if: steps.key.outputs.ready == 'true'
        run: python -m recorder.seal --pubkey keys/recorder_public.pem --src out --dest upload
      - uses: actions/upload-artifact@v4
        if: steps.key.outputs.ready == 'true'
        with:
          name: books-${{ github.run_id }}
          path: upload/
          retention-days: 90
          if-no-files-found: error
